org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
# Only set up the Minecraft versions a command needs (./gradlew :1.21.1-fabric:runClient doesn't touch the other 17)
org.gradle.configureondemand=true

# Minecraft versions, loaders and their dependencies: settings.gradle.kts and stonecutter.properties.toml.

## Simple Voice Chat
# API we compile against; the required range is the oldest API with every event Sipher uses.
# The full mod for dev runs is versioned per Minecraft version in stonecutter.properties.toml.
voicechat_api_version=2.6.24
voicechat_api_min_version=2.5.0

## Speech / inference runtimes
sherpa_onnx_version=1.13.8
onnxruntime_java_version=1.28.0

## Mod
mod_id=sipher
mod_name=Sipher
mod_license=MIT
mod_version=0.2.0
mod_group_id=io.github.eiriksb.sipher
mod_authors=Eirik B.
mod_description=Offline, private live captions and translation for Simple Voice Chat. English speech recognition is built in; other languages are optional in-game downloads.
