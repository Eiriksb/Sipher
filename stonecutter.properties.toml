# Versioned dependencies for each Minecraft version and loader in settings.gradle.kts.
# Read in the build scripts with sc.properties["..."]. Unversioned settings stay in gradle.properties.

deps.fabric_loader = "0.19.5"
loomx.loom_version = "1.18.3"

["1.21.1"]
# Minecraft releases this build is published for on CurseForge and Modrinth.
mod.mc_releases = ["1.21", "1.21.1"]

[fabric."1.21.1"]
# Minecraft versions in fabric.mod.json
mod.mc_compat = ">=1.21 <=1.21.1"
deps.fabric_api = "0.116.17+1.21.1"
deps.modmenu = "11.0.5"
# Simple Voice Chat for dev runs
deps.voicechat = "fabric-1.21.1-2.6.24"

[neoforge."1.21.1"]
# Minecraft versions in neoforge.mods.toml
mod.mc_compat = "[1.21, 1.21.1]"
deps.neoforge = "21.1.256"
deps.voicechat = "neoforge-1.21.1-2.6.24"

