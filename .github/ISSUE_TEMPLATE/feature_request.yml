name: Idea or request
description: Suggest a feature, a language, or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: What should Sipher do, and what problem does it solve for you?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Examples, screenshots, or how other mods do it.
