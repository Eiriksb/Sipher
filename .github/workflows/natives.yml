name: ONNX Runtime JNI glue

# Rebuilds natives/onnxruntime4j_jni/* from source and checks they match what is committed, so the prebuilt binaries in
# the repository can be audited. Run it after bumping onnxruntime_java_version or sherpa_onnx_version.
on:
  pull_request:
    paths: ['natives/**', 'gradle.properties']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: natives/onnxruntime4j_jni/build.sh
        env:
          ZIG: zig
      - name: Compare with committed binaries
        run: git diff --exit-code --stat -- natives/onnxruntime4j_jni
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: onnxruntime4j_jni
          path: natives/onnxruntime4j_jni
