name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew build
      - uses: actions/upload-artifact@v5
        with:
          name: sipher-jar
          path: build/libs/*.jar
          if-no-files-found: error

  # The speech and shared ONNX Runtime tests load the real natives, so run them on every platform Sipher ships for.
  natives:
    name: Natives (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-latest }
          - { platform: linux-aarch64, os: ubuntu-24.04-arm }
          - { platform: osx-aarch64, os: macos-latest }
          - { platform: osx-x64, os: macos-15-intel }
          - { platform: win-x64, os: windows-latest }
          - { platform: win-arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew test --tests '*SpeechPipelineTest' --tests '*SharedOnnxRuntimeTest'
        env:
          SIPHER_REQUIRE_NATIVES: 'true'
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-report-${{ matrix.platform }}
          path: build/reports/tests

  # Every push to main (including merged pull requests) that passes on all platforms replaces the rolling
  # "Development build" pre-release, so the newest jar is always one click away on the Releases page.
  dev-release:
    name: Publish development build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, natives]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: dev-release
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: sipher-jar
          path: dist
      - name: Replace the development build release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Runs can finish out of order when several pull requests merge at once. Only the commit that is still the
          # head of main may replace the build (GitHub also refuses to tag an older commit whose workflows differ).
          head="$(gh api "repos/$GH_REPO/commits/main" --jq .sha)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main has moved on to ${head::7}; that run publishes the development build."
            exit 0
          fi
          short="${GITHUB_SHA::7}"
          for jar in dist/*.jar; do mv "$jar" "${jar%.jar}-${short}.jar"; done
          {
            echo "Automatic build of \`main\` at ${GITHUB_SHA}, replaced on every merge. For testing, not a release."
            echo
            echo "Install the same jar on clients and (optionally) servers, together with Simple Voice Chat."
            echo
            echo "Latest change:"
            echo
            printf '%s\n' "$COMMIT_MESSAGE" | head -n 1 | sed 's/^/> /'
          } > notes.md
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev dist/*.jar --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Development build (${short})" --notes-file notes.md

  # Pushing a tag such as v0.1.0 publishes that version, built and tested exactly like every merge to main.
  # See docs/RELEASING.md. CurseForge and Modrinth are skipped until their project id and token are configured.
  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, natives]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: sipher-jar
          path: dist
      - name: Check version and changelog
        id: release
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [ "$version" != "$declared" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mod_version=$declared in gradle.properties"
            exit 1
          fi
          changelog="docs/changelogs/${version}.md"
          if [ ! -f "$changelog" ]; then
            echo "::error::Write $changelog before tagging"
            exit 1
          fi
          jar="dist/sipher-${version}.jar"
          if [ ! -f "$jar" ]; then
            echo "::error::The build did not produce $jar"
            exit 1
          fi
          case "$version" in
            *-alpha*) type=alpha ;;
            0.*|*-beta*) type=beta ;;
            *) type=release ;;
          esac
          {
            echo "version=$version"
            echo "type=$type"
            echo "changelog=$changelog"
            echo "jar=$jar"
          } >> "$GITHUB_OUTPUT"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
          TYPE: ${{ steps.release.outputs.type }}
          CHANGELOG: ${{ steps.release.outputs.changelog }}
          JAR: ${{ steps.release.outputs.jar }}
        run: |
          prerelease=()
          if [ "$TYPE" != release ]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$JAR" --verify-tag --title "Sipher $VERSION" \
            --notes-file "$CHANGELOG" "${prerelease[@]}"
      - name: CurseForge
        if: env.CURSEFORGE_TOKEN != '' && vars.CURSEFORGE_PROJECT_ID != ''
        uses: Kira-NT/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: ${{ steps.release.outputs.jar }}
          name: Sipher ${{ steps.release.outputs.version }}
          version: ${{ steps.release.outputs.version }}
          version-type: ${{ steps.release.outputs.type }}
          changelog-file: ${{ steps.release.outputs.changelog }}
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          dependencies: simple-voice-chat(required){curseforge:simple-voice-chat}
      - name: Modrinth
        if: env.MODRINTH_TOKEN != '' && vars.MODRINTH_PROJECT_ID != ''
        uses: Kira-NT/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          files: ${{ steps.release.outputs.jar }}
          name: Sipher ${{ steps.release.outputs.version }}
          version: ${{ steps.release.outputs.version }}
          version-type: ${{ steps.release.outputs.type }}
          changelog-file: ${{ steps.release.outputs.changelog }}
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          # Simple Voice Chat's Modrinth project id.
          dependencies: simple-voice-chat(required){modrinth:9eGKb6K1}
