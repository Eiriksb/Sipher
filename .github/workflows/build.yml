name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew build
      - uses: actions/upload-artifact@v5
        with:
          name: sipher-jar
          path: build/libs/*.jar
          if-no-files-found: error

  # The speech and shared ONNX Runtime tests load the real natives, so run them on every platform Sipher ships for.
  natives:
    name: Natives (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-latest }
          - { platform: linux-aarch64, os: ubuntu-24.04-arm }
          - { platform: osx-aarch64, os: macos-latest }
          - { platform: osx-x64, os: macos-15-intel }
          - { platform: win-x64, os: windows-latest }
          - { platform: win-arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew test --tests '*SpeechPipelineTest' --tests '*SharedOnnxRuntimeTest'
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-report-${{ matrix.platform }}
          path: build/reports/tests
